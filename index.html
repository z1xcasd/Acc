<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF1FB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>บัญชี</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F3F5FA;color:#16203A;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #3D5AFE;outline-offset:2px}
h1{margin:0;font-size:22px;font-weight:700}
.muted{color:#5B6680}

.month{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:999px;padding:4px}
.month button{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:flex;align-items:center;justify-content:center}
.month button:active{background:#F3F5FA}
.month span{font-size:17px;font-weight:600}

.hero{background:#16203A;border-radius:22px;padding:20px 20px 18px}
.hero .l{font-size:14px;color:#A9B4CE}
.hero .b{font-size:40px;font-weight:700;color:#fff;letter-spacing:-.5px;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:#FF8A98}
.hero .s{display:flex;justify-content:space-between;font-size:13.5px;color:#A9B4CE;margin-top:8px;gap:8px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border-radius:18px;padding:14px 16px}
.card .l{font-size:14px;color:#5B6680}
.card .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-all}
.inc{color:#087A6B}.exp{color:#B42B41}

.panel{background:#fff;border-radius:18px;padding:16px 16px 6px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ph h2{margin:0;font-size:17px;font-weight:600}
.seg{display:flex;background:#F3F5FA;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#5B6680;min-height:36px}
.seg button.on{background:#16203A;color:#fff}

.row{display:flex;align-items:center;gap:12px;min-height:60px;width:100%;border:0;border-top:1px solid #EDF0F5;background:transparent;text-align:left;color:inherit;padding:0}
.row .g{flex-grow:1;min-width:0}
.row .t{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:500}
.row .t b{font-weight:600;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:#E6EAF2;margin-top:6px}
.track i{display:block;height:100%;border-radius:99px}
.chev{flex:none}
.all{width:100%;min-height:48px;border:0;border-top:1px solid #EDF0F5;background:transparent;color:#3D5AFE;font-size:15px;font-weight:600}

.back{display:flex;align-items:center;gap:4px;min-height:44px;width:fit-content;border:0;background:transparent;color:#16203A;font-size:16px;font-weight:500;padding:0}
.title{font-size:30px;font-weight:700;line-height:1.2}
.sub{font-size:15px;color:#5B6680;margin-top:2px}
.sum{background:#16203A;border-radius:18px;padding:16px 20px;display:flex;align-items:baseline;justify-content:space-between}
.sum span:first-child{font-size:14px;color:#A9B4CE}
.sum span:last-child{font-size:28px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.item .n{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:14px;color:#5B6680}
.item .a{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.big{background:#fff;border-radius:22px;padding:24px 20px;text-align:center}
.badge{display:inline-block;font-size:14px;font-weight:600;border-radius:999px;padding:3px 14px}
.badge.e{color:#B42B41;background:#FDE6E9}.badge.i{color:#087A6B;background:#DDF4F0}
.big .amt{font-size:46px;font-weight:700;letter-spacing:-.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.big .nt{font-size:16px;color:#5B6680;margin-top:2px;word-break:break-word}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;border-top:1px solid #EDF0F5}
.kv:first-child{border-top:0}
.kv span:first-child{font-size:15px;color:#5B6680}
.kv span:last-child{font-size:16px;font-weight:500;text-align:right;word-break:break-word}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{min-height:50px;border:1px solid #C9D0DF;border-radius:14px;background:#fff;color:#16203A;font-size:16px;font-weight:600}
.btn.del{border-color:#E8A3AE;color:#B42B41}
.btn.sure{background:#B42B41;border-color:#B42B41;color:#fff}
.btn:disabled{opacity:.55}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{min-height:48px;border:1px solid #C9D0DF;border-radius:12px;background:#fff;font-size:15px;font-weight:500;color:#16203A}
.chip.on{background:#16203A;color:#fff;border-color:#16203A}

.note{font-size:13px;color:#5B6680;text-align:center}
.note button{border:0;background:transparent;color:#5B6680;text-decoration:underline;font-size:13px;min-height:36px}
.err{background:#FDE6E9;color:#B42B41;border-radius:12px;padding:10px 14px;font-size:15px}
.empty{color:#5B6680;text-align:center;padding:26px 8px;font-size:15px}

.wrap{padding-bottom:104px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(18px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px;border:0;border-radius:999px;background:#16203A;color:#fff;font-size:17px;font-weight:600;box-shadow:0 6px 18px rgba(22,32,58,.28);display:flex;align-items:center;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(22,32,58,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:#D5DAE6;margin:0 auto 4px}
.sheet h2{margin:0;font-size:19px;font-weight:700}
.opt{display:flex;flex-direction:column;gap:2px;min-height:68px;justify-content:center;padding:12px 16px;border-radius:16px;background:#F3F5FA;color:#16203A;text-decoration:none;border:1px solid #E1E6EF}
.opt b{font-size:18px;font-weight:700}
.opt span{font-size:14px;color:#5B6680}
.sheet .cancel{min-height:48px;border:0;background:transparent;color:#5B6680;font-size:16px;font-weight:600}
.sheet .hint{margin:0;font-size:13px;color:#5B6680;text-align:center}

.prog{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#5B6680}
.prog .tr{height:6px;border-radius:99px;background:#E1E6EF;overflow:hidden}
.prog .tr i{display:block;height:100%;background:#16203A;border-radius:99px}
.q{font-size:28px;font-weight:700;line-height:1.25;margin:6px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:120px;border:1px solid #E1E6EF;border-radius:20px;background:#fff;font-size:22px;font-weight:700}
.tile.e{color:#B42B41}.tile.i{color:#087A6B}
.bigin{width:100%;border:1px solid #C9D0DF;border-radius:16px;background:#fff;padding:14px 16px;font-family:inherit;font-size:40px;font-weight:700;color:#16203A;font-variant-numeric:tabular-nums}
.fin{width:100%;min-height:50px;border:1px solid #C9D0DF;border-radius:14px;background:#fff;padding:10px 14px;font-family:inherit;font-size:17px;color:#16203A}
.lab{font-size:14px;color:#5B6680;margin:4px 0 -4px}
.go{min-height:54px;border:0;border-radius:16px;background:#16203A;color:#fff;font-size:18px;font-weight:700}
.go:disabled{opacity:.55}
.sumbox{background:#fff;border-radius:16px;padding:14px 16px;font-size:16px}
.sumbox b{font-weight:700}
.okbox{background:#DDF4F0;color:#087A6B;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}
.link{border:0;background:transparent;color:#3D5AFE;font-size:15px;font-weight:600;min-height:44px}
.chips.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.fin.say{font-size:20px;min-height:58px}
.ubtn{border:0;background:transparent;color:#087A6B;text-decoration:underline;font-size:15px;font-weight:700;min-height:36px;padding:0 6px}
.okbox{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip.inc{color:#087A6B;border-color:#BFE6DF;background:#F2FBF9}
.chip.inc.on{background:#087A6B;color:#fff;border-color:#087A6B}
.fabs{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.fabs .fab{position:static}
.micfab{width:56px;height:56px;border:0;border-radius:50%;background:#087A6B;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(8,122,107,.3)}
.camfab{width:56px;height:56px;border:1px solid #C9D0DF;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(22,32,58,.16)}
.thumb{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid #E1E6EF}
.warn{background:#FFF4DB;color:#7A4B00;border-radius:12px;padding:10px 14px;font-size:15px}
select.fin{appearance:auto}
.lrow{align-items:start}.lrow .ptog{margin-top:2px}.lrow.off{opacity:.55}
.ldate{min-height:40px;padding:4px 10px;font-size:15px}
.ltype{border:0;background:transparent;font-size:13px;font-weight:700;padding:4px 0;min-height:32px}
.ltype.inc{color:#087A6B}.ltype.exp{color:#B42B41}
.kvbtn{width:100%;border:0;border-top:1px solid #EDF0F5;background:transparent;font-family:inherit;color:inherit;padding:0;cursor:pointer}
.kvbtn span:last-child{display:inline-flex;align-items:center;gap:4px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px}
.ptog{width:44px;height:44px;border:1.5px solid #C9D0DF;border-radius:12px;background:#fff;font-size:20px;font-weight:700;color:#fff}
.ptog.on{background:#16203A;border-color:#16203A}
.pmid{min-width:0;display:flex;flex-direction:column;gap:2px}
.pmid .fin{min-height:44px;padding:6px 10px;font-size:16px}
.pty{font-size:12.5px;padding-left:2px}
.pamt{text-align:right;min-height:44px;padding:6px 10px;font-size:16px;font-variant-numeric:tabular-nums}
.psum{background:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.7}
.psum .ok{color:#087A6B;font-weight:600}.psum .bad{color:#B42B41;font-weight:600}

/* ===== สกินแบบเช็คระยะ: Liquid Glass โทนสว่าง (เปลี่ยนเฉพาะสี/เงา/พื้นหลัง ไม่แตะระยะห่าง) ===== */
:root{--accent:#2E6BD0;--next:#1F57B5;--surface:rgba(255,255,255,.94);
 --glass:linear-gradient(180deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.58) 100%);
 --glass-edge:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.4);
 --glass-shadow:0 8px 24px rgba(40,70,130,.10),0 1px 3px rgba(40,70,130,.08);
 --glass-blur:blur(22px) saturate(180%);
 --tint:linear-gradient(180deg,#3670D6 0%,#2559BA 100%);
 --tint-edge:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -1px 1px rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.18)}
html,body{background:#EEF3FB}
body{background:linear-gradient(180deg,#E2EBFA 0%,#EEF2FC 45%,#F7F4FB 100%) fixed;color:#151B24}
.muted,.card .l,.item .d,.sub,.lab,.note,.empty,.kv span:first-child,.big .nt,.prog{color:#4B5662}
button:focus-visible,a:focus-visible{outline-color:#2E6BD0}
/* เนื้อหา: พื้นขาวเกือบทึบ */
.card,.panel,.big,.sumbox{background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 #fff,var(--glass-shadow)}
.tile{background:var(--surface);border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,var(--glass-shadow)}
.row,.all,.kv{border-top-color:rgba(30,50,90,.09)}
.track{background:rgba(30,50,90,.10)}
/* ส่วนควบคุม: กระจก */
.month,.seg{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow)}
.btn,.chip,.fin,.bigin,.camfab,.thumb{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.75);box-shadow:var(--glass-edge),var(--glass-shadow)}
.fin,.bigin{background:var(--surface);border:1px solid rgba(30,50,90,.16);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(40,70,130,.08)}
.bigin{border:1.5px solid rgba(46,107,208,.45)}
.fin:focus,.bigin:focus{outline:none;border-color:rgba(46,107,208,.6);box-shadow:0 0 0 3px rgba(46,107,208,.2)}
.month button:active{background:rgba(46,107,208,.1)}
.seg button.on{background:var(--tint);box-shadow:var(--tint-edge)}
.seg button{color:#4B5662}
.chip.on,.btn.sure{background:var(--tint);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:var(--tint-edge),0 8px 22px rgba(46,107,208,.28)}
.go,.fab,.sum,.hero{background:var(--tint);color:#fff;box-shadow:var(--tint-edge),0 8px 22px rgba(46,107,208,.28)}
.hero .l,.hero .s,.sum span:first-child{color:#D6E3FA}
.bar{background:rgba(255,255,255,.28)}.bar i{background:#fff}
.btn.del{color:#9B2C1F;border-color:rgba(214,120,108,.55)}
.btn.sure{background:linear-gradient(180deg,#D4453A 0%,#B3261E 100%)}
.go:disabled{background:rgba(255,255,255,.55);color:#4B5662;box-shadow:var(--glass-edge);opacity:1}
.chip.inc{color:#087A6B;background:linear-gradient(180deg,rgba(242,251,249,.95),rgba(221,244,240,.7))}
.chip.inc.on{background:linear-gradient(180deg,#14A08C 0%,#087A6B 100%);color:#fff}
.all,.link{color:#1F57B5}
.fab{border-radius:999px}
.micfab{background:linear-gradient(180deg,#14A08C 0%,#087A6B 100%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 22px rgba(8,122,107,.3)}
.sheet{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 #fff,0 -10px 30px rgba(40,70,130,.15)}
.scrim{background:rgba(21,27,36,.5)}
.opt{background:var(--glass);border:1px solid rgba(255,255,255,.75);box-shadow:var(--glass-edge),var(--glass-shadow)}
.prog .tr{background:rgba(30,50,90,.12)}.prog .tr i{background:var(--accent)}
.warn,.err{border-radius:12px}
.wrap button{transition:opacity .12s ease}
.wrap button:not([disabled]):active{opacity:.7}
@media (prefers-reduced-transparency:reduce){
 .month,.btn,.chip,.fin,.bigin,.seg,.camfab,.sheet,.opt{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
 .chip.on,.btn.sure,.go,.fab,.sum,.hero,.seg button.on{background:#2E6BD0}}

/* ---------- เพิ่มรูป: แผ่นเลือก + ครอป + ลากวาง ---------- */
.crop-stage{display:flex;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-wrap{position:relative;display:inline-block;line-height:0;overflow:hidden;border-radius:6px;touch-action:none}
.crop-wrap img{display:block;max-width:100%;max-height:56vh;pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.cr-box{position:absolute;border:2px solid #fff;outline:1px solid rgba(21,27,36,.35);box-shadow:0 0 0 9999px rgba(21,27,36,.55);touch-action:none}
.cr-box::before,.cr-box::after{content:'';position:absolute;inset:33.33% 0;border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.5);pointer-events:none}
.cr-box::after{inset:0 33.33%;border:0;border-left:1px solid rgba(255,255,255,.5);border-right:1px solid rgba(255,255,255,.5)}
.cr-box i{position:absolute;width:44px;height:44px;z-index:1}
.cr-box i::before{content:'';position:absolute;width:20px;height:20px;border:4px solid #fff}
.cr-box i::before{filter:drop-shadow(0 0 1px rgba(21,27,36,.6))}
.cr-box .tl{left:-10px;top:-10px}.cr-box .tl::before{left:8px;top:8px;border-right:0;border-bottom:0}
.cr-box .tr{right:-10px;top:-10px}.cr-box .tr::before{right:8px;top:8px;border-left:0;border-bottom:0}
.cr-box .bl{left:-10px;bottom:-10px}.cr-box .bl::before{left:8px;bottom:8px;border-right:0;border-top:0}
.cr-box .br{right:-10px;bottom:-10px}.cr-box .br::before{right:8px;bottom:8px;border-left:0;border-top:0}
.pastebox{min-height:56px;display:flex;align-items:center;justify-content:center;padding:12px 14px;border:1.5px dashed rgba(46,107,208,.5);border-radius:14px;background:rgba(255,255,255,.6);color:#4B5662;font-size:15px;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
.pastebox:focus{border-color:#2E6BD0;box-shadow:0 0 0 3px rgba(46,107,208,.18)}
.dropbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px 16px;border:2px dashed rgba(46,107,208,.5);border-radius:20px;background:rgba(244,248,255,.8);transition:background .15s,border-color .15s}
.dropbox.over{border-color:#2E6BD0;background:rgba(214,228,250,.95)}
.dbmain{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:4px 0;color:#151B24}
.dbmain b{font-size:18px;font-weight:700;margin-top:4px}
.dbmain span{font-size:14px;color:#4B5662}
.dbpaste{min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 20px;border-radius:22px;border:1px solid rgba(255,255,255,.75);background:var(--glass);box-shadow:var(--glass-edge),var(--glass-shadow);font-size:15px;font-weight:600;color:#1F57B5;outline:none;-webkit-user-select:text;user-select:text}
.dropov{position:fixed;inset:10px;z-index:40;border-radius:24px;border:3px dashed #2E6BD0;background:rgba(226,235,250,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#1F57B5;pointer-events:none}
.dropov[hidden]{display:none}

/* ---------- นับเงินเดือนเดือนถัดไป + ทรัพย์สิน-หนี้ ---------- */
.mon{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),var(--glass-shadow)}
.mon .t{font-size:15px;font-weight:600}
.tiny{font-size:13.5px;color:#4B5662;line-height:1.45}
.card .tiny{margin-top:2px}
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;width:100%;border:0;border-radius:18px;padding:12px 16px;text-align:left;color:inherit;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 #fff,var(--glass-shadow)}
.linkcard b{display:block;font-size:16px;font-weight:600}
.asset{display:flex;align-items:center;gap:12px;min-height:76px;width:100%;border:0;border-top:1px solid rgba(30,50,90,.09);background:transparent;text-align:left;color:inherit;padding:10px 0}
.asset:first-child{border-top:0}
.asset .g{flex:1;min-width:0}.asset .nm{font-size:16px;font-weight:600}.asset .sb{font-size:13.5px;color:#4B5662}
.asset .rr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;font-variant-numeric:tabular-nums}.asset .est{margin-left:0}.asset .mi{font-size:17px;font-weight:700}.asset .ch{font-size:13px;font-weight:600}
.ic{flex:none;width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#F4F8FF,#DCE8FB);font-size:19px}
.est{font-size:12px;font-weight:600;color:#8A4B00;background:#FFF1D6;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle}
.calc{background:rgba(241,245,252,.9);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7}
.calc div{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.calc .tot{border-top:1px solid rgba(30,50,90,.12);margin-top:4px;padding-top:4px;font-weight:700}
.sheet.tall{max-height:92vh;overflow-y:auto}
.hist{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#4B5662;padding:6px 0;border-top:1px solid rgba(30,50,90,.08);font-variant-numeric:tabular-nums}
.hist:first-child{border-top:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:#4B5662;padding:10px 0 2px}
.addrow{width:100%;min-height:52px;border:1.5px dashed rgba(46,107,208,.5);border-radius:14px;background:rgba(255,255,255,.6);color:#1F57B5;font-size:16px;font-weight:600}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.icb{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.85);box-shadow:var(--glass-edge),var(--glass-shadow);padding:0}
.icb.on{outline:2.5px solid #2E6BD0}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;width:100%;border:0;background:transparent;padding:0;font-size:15px;color:inherit;text-align:left}
.sw{width:50px;height:30px;border-radius:15px;background:#2E6BD0;position:relative;flex:none;transition:background .15s}.sw::after{content:'';position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.off{background:rgba(30,50,90,.18)}.sw.off::after{right:auto;left:3px}
.close{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),var(--glass-shadow)}
.close .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.close .h b{font-size:16px}.close .h span{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.btn.primary{background:var(--tint);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:var(--tint-edge),0 8px 22px rgba(46,107,208,.28)}
.carry{font-size:14px;color:#D6E3FA;margin:-8px 0 12px}
.minibtn{border:0;background:transparent;color:#9B2C1F;font-size:14px;font-weight:600;min-height:32px;padding:0 4px;text-decoration:underline}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<input type="file" id="rc-file" accept="image/*" style="display:none">
<div id="dropov" class="dropov" hidden>ปล่อยรูปตรงนี้</div>

<script>
(function () {
  // ตั้งค่าเชื่อมต่อ (เก็บในเครื่องนี้เท่านั้น)
  var CFG = null;
  try { CFG = JSON.parse(localStorage.getItem('exp.cfg') || 'null'); } catch (e) { CFG = null; }
  var TOKEN = CFG && CFG.token ? CFG.token : '';
  var BASE = CFG && CFG.base ? CFG.base : '';

  // เรียก Apps Script ผ่าน fetch (แทน google.script.run)
  var PIGGY = null;
  function cacheLoad() {
    try { var c = JSON.parse(localStorage.getItem('exp.cache') || 'null'); return c && Array.isArray(c.tx) ? c : null; } catch (e) { return null; }
  }
  function cacheSave() {
    try { localStorage.setItem('exp.cache', JSON.stringify({ t: Date.now(), tx: S.tx })); } catch (e) {}
  }
  function hhmm(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  // อัปเดตตารางในเครื่องทันทีหลังบันทึก/ลบ/แก้ ไม่ต้องรอโหลดทั้งชีตใหม่
  function stamp() { S.updated = hhmm(new Date()); cacheSave(); }
  function applyItems(arr) {
    (arr || []).forEach(function (it) {
      S.tx = S.tx.filter(function (t) { return t.row !== it.row; });
      S.tx.push(it);
    });
    stamp();
  }
  function applyDelete(row) {
    S.tx = S.tx.filter(function (t) { return t.row !== row; }).map(function (t) {
      if (t.row > row) { var c = {}; for (var k in t) c[k] = t[k]; c.row = t.row - 1; return c; }
      return t;
    });
    stamp();
  }
  function applyCat(row, cat, sig) {
    S.tx.forEach(function (t) { if (t.row === row) { t.cat = cat; if (sig) t.sig = sig; } });
    stamp();
  }
  function editing() { return S.pick || !!S.close || (S.screen === 'assets' && (!!A.key || !!A.form)) || S.screen === 'add' || S.screen === 'say' || S.screen === 'receipt' || S.screen === 'crop' || S.screen === 'setup'; }

  function callApi(name, params, ok, bad) {
    var q = ['api=' + encodeURIComponent(name), 'token=' + encodeURIComponent(TOKEN), '_=' + Date.now()];
    Object.keys(params || {}).forEach(function (k) {
      if (params[k] !== undefined && params[k] !== null) q.push(k + '=' + encodeURIComponent(params[k]));
    });
    fetch(BASE + '?' + q.join('&'), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) {
          PIGGY = (j.list && Array.isArray(j.list)) ? j.list : null;
          try { if (ok) ok(j.data); } finally { PIGGY = null; }
        }
        else if (bad) bad(new Error((j && j.error) || 'เกิดข้อผิดพลาด'));
      })
      .catch(function () { if (bad) bad(new Error('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือลิงก์')); });
  }
  function runner(ok, bad) {
    return {
      withSuccessHandler: function (f) { return runner(f, bad); },
      withFailureHandler: function (f) { return runner(ok, f); },
      apiPing: function () { callApi('ping', {}, ok, bad); },
      apiList: function () { callApi('list', {}, ok, bad); },
      apiAdd: function (t, o) { callApi('add', o, ok, bad); },
      apiAddText: function (t, text) { callApi('addText', { text: text }, ok, bad); },
      apiDelete: function (t, row, sig) { callApi('delete', { row: row, sig: sig }, ok, bad); },
      apiSetCategory: function (t, row, sig, cat) { callApi('setCat', { row: row, sig: sig, cat: cat }, ok, bad); }
    };
  }
  var google = { script: { run: runner(null, null) } };

  var EXP = ['อาหาร', 'เดินทาง', 'ที่พัก/ค่าน้ำไฟ', 'ช้อปปิ้ง', 'สุขภาพ', 'บันเทิง', 'ออม/ลงทุน', 'อื่นๆ'];
  var INC = ['เงินเดือน', 'ขายของ/ธุรกิจ', 'คอมมิชชัน', 'โบนัส', 'อื่นๆ'];
  var COLOR = {
    'อาหาร': '#1BAF7A', 'เดินทาง': '#EDA100', 'ที่พัก/ค่าน้ำไฟ': '#2A78D6', 'ช้อปปิ้ง': '#EB6834',
    'สุขภาพ': '#0EA5E9', 'บันเทิง': '#E87BA4', 'ออม/ลงทุน': '#8B5CF6', 'อื่นๆ': '#8A94A8',
    'เงินเดือน': '#0C9A87', 'ขายของ/ธุรกิจ': '#14B8A6', 'คอมมิชชัน': '#22C55E', 'โบนัส': '#84CC16'
  };
  var MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  var now = new Date();
  var S = {
    tx: [], ym: now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2),
    kind: 'expense', screen: 'home', cat: null, row: null,
    note: '', noteType: 'expense', noteFrom: null, from: null, noteEdit: false, notePick: '',
    edit: false, confirm: false, busy: false, loading: true, err: '', updated: '', msg: '', undo: null, listening: false
  };

  var R = { busy: false, preview: '', data: null };
  var W = {};
  function resetW() { W = { step: 1, type: 'expense', cat: null, amount: '', note: '', dateMode: 'today', date: '', say: '', label: '' }; }
  resetW();
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  (function () {
    var c = TOKEN ? cacheLoad() : null;
    if (c) { S.tx = c.tx; S.updated = hhmm(new Date(c.t)); }
  })();

  var nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var app = document.getElementById('app');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return nf.format(n); }
  function colorOf(c) { return COLOR[c] || '#8A94A8'; }
  function shiftMonth(k, d) {
    var p = k.split('-'); var dt = new Date(+p[0], +p[1] - 1 + d, 1);
    return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2);
  }
  function monthLabel(k) { var p = k.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function dayLabel(w) { return w.slice(8, 10) + ' ' + MS[+w.slice(5, 7) - 1]; }
  function fullDay(w) { return w.slice(8, 10) + ' ' + MS[+w.slice(5, 7) - 1] + ' ' + w.slice(0, 4); }
  function timeOf(w) { return w.slice(11, 16); }
  // เดือนที่นับรายการ: คอลัมน์ "นับเป็นเดือน" ถ้ามี ไม่งั้นเงินเดือนที่เข้าตั้งแต่วันที่ 15 นับเป็นเดือนถัดไป
  var SHIFT_DAY = 15;
  function autoBm(date, type, cat) {
    var m = String(date).slice(0, 7);
    if (type !== 'income' || cat !== 'เงินเดือน' || +String(date).slice(8, 10) < SHIFT_DAY) return m;
    return shiftMonth(m, 1);
  }
  function bmOf(t) { return t.bm || autoBm(t.when, t.type, t.cat); }
  function shortDay(w) { return +w.slice(8, 10) + ' ' + MS[+w.slice(5, 7) - 1]; }
  function msLabel(k) { var p = k.split('-'); return MS[+p[1] - 1] + ' ' + p[0]; }
  function inMonth(t) { return bmOf(t) === S.ym; }

  function totals() {
    var i = 0, e = 0;
    S.tx.forEach(function (t) { if (inMonth(t)) { if (t.type === 'income') i += t.amount; else e += t.amount; } });
    return { i: i, e: e };
  }
  function catRows(kind) {
    var by = {}, total = 0;
    S.tx.forEach(function (t) { if (inMonth(t) && t.type === kind) { by[t.cat] = (by[t.cat] || 0) + t.amount; total += t.amount; } });
    var rows = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }).map(function (c) {
      return { cat: c, amt: by[c], pct: total ? by[c] / total * 100 : 0 };
    });
    return { rows: rows, total: total };
  }
  function listRows() {
    return S.tx.filter(function (t) {
      return inMonth(t) && t.type === S.kind && (S.cat === null || t.cat === S.cat);
    }).sort(function (a, b) { return a.when < b.when ? 1 : a.when > b.when ? -1 : b.row - a.row; });
  }
  function findRow(r) { for (var i = 0; i < S.tx.length; i++) if (S.tx[i].row === r) return S.tx[i]; return null; }

  var CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  var LEFT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var RIGHT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  function footer() {
    return '<div class="note">' + (S.loading ? 'กำลังโหลดข้อมูล…' : 'อัปเดตล่าสุด ' + esc(S.updated)) +
      ' · <button data-act="refresh" type="button">รีเฟรช</button> · <button data-act="logout" type="button">เปลี่ยนลิงก์</button></div>';
  }
  function errBox() { return S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : ''; }

  function homeHTML() {
    var t = totals(), cin = carryInto(S.ym), bal = cin + t.i - t.e;
    var pct = t.i > 0 ? Math.min(100, t.e / t.i * 100) : (t.e > 0 ? 100 : 0);
    var left = t.i > 0 ? 'ใช้ไปแล้ว ' + Math.round(t.e / t.i * 100) + '% ของรายรับ' : (t.e > 0 ? 'ยังไม่มีรายรับในเดือนนี้' : 'ยังไม่มีรายการในเดือนนี้');
    var right = t.i > 0 ? (t.i - t.e >= 0 ? 'เก็บได้ ' + Math.round((t.i - t.e) / t.i * 100) + '%' : 'ใช้เกินรายรับ') : '';
    var cr = catRows(S.kind);
    var rows = cr.rows.map(function (r) {
      return '<button class="row" type="button" data-act="cat" data-v="' + esc(r.cat) + '">' +
        '<div class="g"><div class="t"><span>' + esc(r.cat) + '</span><b>' + money(r.amt) + '</b></div>' +
        '<div class="track"><i style="width:' + r.pct.toFixed(1) + '%;background:' + colorOf(r.cat) + '"></i></div></div>' + CHEV + '</button>';
    }).join('');
    if (!rows) rows = '<div class="empty">ยังไม่มี' + (S.kind === 'income' ? 'รายรับ' : 'รายจ่าย') + 'ในเดือนนี้</div>';
    return '<h1>บัญชีรายรับ-รายจ่าย</h1>' + errBox() + okBox() +
      '<div class="month"><button type="button" data-act="prev" aria-label="เดือนก่อนหน้า">' + LEFT + '</button><span>' + monthLabel(S.ym) +
      '</span><button type="button" data-act="next" aria-label="เดือนถัดไป">' + RIGHT + '</button></div>' +
      closeCardHTML() +
      '<div class="hero"><div class="l">ยอดคงเหลือเดือนนี้</div><div class="b">' + (bal < 0 ? '-' : '') + '฿' + money(Math.abs(bal)) + '</div>' +
      (cin ? '<div class="carry">รวมยกมาจาก ' + msLabel(shiftMonth(S.ym, -1)) + ' ' + (cin > 0 ? '+' : '−') + money(Math.abs(cin)) + '</div>' : '') +
      '<div class="bar" aria-hidden="true"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="s"><span>' + left + '</span><span>' + right + '</span></div></div>' +
      '<div class="two"><div class="card"><div class="l">รายรับ</div><div class="v inc">' + money(t.i) + '</div>' + shiftNote() + '</div>' +
      '<div class="card"><div class="l">รายจ่าย</div><div class="v exp">' + money(t.e) + '</div></div></div>' +
      '<div class="panel"><div class="ph"><h2>' + (S.kind === 'income' ? 'รายรับ' : 'รายจ่าย') + 'ตามหมวด</h2>' +
      '<div class="seg"><button type="button" data-act="kind" data-v="expense" class="' + (S.kind === 'expense' ? 'on' : '') + '">รายจ่าย</button>' +
      '<button type="button" data-act="kind" data-v="income" class="' + (S.kind === 'income' ? 'on' : '') + '">รายรับ</button></div></div>' +
      rows + '<button class="all" type="button" data-act="all">ดู' + (S.kind === 'income' ? 'รายรับ' : 'รายจ่าย') + 'ทั้งหมดของเดือนนี้</button></div>' +
      '<button class="linkcard" type="button" data-act="assets"><div><b>ทรัพย์สิน-หนี้</b><div class="tiny">อทบ. · หุ้นสหกรณ์ · กบข. · หนี้สหกรณ์</div></div>' + CHEV + '</button>' + footer();
  }
  // หมายเหตุใต้รายรับ: เงินเดือนที่เข้าเดือนก่อนแต่นับเดือนนี้ / เข้าเดือนนี้แต่ไปนับเดือนหน้า
  function shiftNote() {
    var inn = [], out = [];
    S.tx.forEach(function (t) {
      if (t.type !== 'income') return;
      var b = bmOf(t), w = t.when.slice(0, 7);
      if (b === S.ym && w !== S.ym) inn.push(t);
      else if (w === S.ym && b !== S.ym) out.push(t);
    });
    var txt = '';
    if (inn.length) txt += 'รวมเงินเดือนที่เข้า ' + inn.map(function (t) { return shortDay(t.when); }).join(', ');
    if (out.length) txt += (txt ? ' · ' : '') + 'เงินที่เข้า ' + out.map(function (t) { return shortDay(t.when); }).join(', ') + ' นับใน ' + msLabel(bmOf(out[0]));
    return txt ? '<div class="tiny">' + esc(txt) + '</div>' : '';
  }

  function listHTML() {
    var rows = listRows();
    var total = rows.reduce(function (s, t) { return s + t.amount; }, 0);
    var name = S.cat === null ? 'ทั้งหมด' : S.cat;
    var items = rows.map(function (t) {
      var sign = t.type === 'income' ? '+' : '-';
      var cls = t.type === 'income' ? 'inc' : 'exp';
      var d = dayLabel(t.when) + ' · ' + timeOf(t.when) + (S.cat === null ? ' · ' + esc(t.cat) : '');
      return '<button class="row item" type="button" data-act="open" data-v="' + t.row + '" style="min-height:66px">' +
        '<div class="g" style="min-width:0"><div class="n">' + esc(t.note || t.cat) + '</div><div class="d">' + d + '</div></div>' +
        '<div class="a ' + cls + '">' + sign + money(t.amount) + '</div>' + CHEV + '</button>';
    }).join('');
    if (!items) items = '<div class="empty">ไม่มีรายการ</div>';
    return errBox() + '<button class="back" type="button" data-act="home">' + LEFT + 'หน้าหลัก</button>' +
      '<div><div class="title">' + esc(name) + '</div><div class="sub">' + monthLabel(S.ym) + ' · ' + rows.length + ' รายการ · ' +
      (S.kind === 'income' ? 'รายรับ' : 'รายจ่าย') + '</div></div>' +
      '<div class="sum"><span>รวม</span><span>฿' + money(total) + '</span></div>' +
      '<div class="panel" style="padding-top:2px">' + items + '</div>' + footer();
  }

  function detailHTML() {
    var t = findRow(S.row);
    var isInc = t.type === 'income';
    var kv = function (k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; };
    var cats = (isInc ? INC : EXP);
    var chips = '';
    if (S.edit) {
      chips = '<div class="panel" style="padding-bottom:16px"><div class="ph"><h2>เลือกหมวดใหม่</h2></div><div class="chips">' +
        cats.map(function (c) {
          return '<button class="chip' + (c === t.cat ? ' on' : '') + '" type="button" data-act="setcat" data-v="' + esc(c) + '"' + (S.busy ? ' disabled' : '') + '>' + esc(c) + '</button>';
        }).join('') + '</div></div>';
    }
    return errBox() + '<button class="back" type="button" data-act="back">' + LEFT + esc(S.from === 'note' ? S.note : (S.cat === null ? 'รายการทั้งหมด' : S.cat)) + '</button>' +
      '<div class="big"><span class="badge ' + (isInc ? 'i' : 'e') + '">' + (isInc ? 'รายรับ' : 'รายจ่าย') + '</span>' +
      '<div class="amt">' + (isInc ? '+' : '-') + money(t.amount) + '</div><div class="nt">' + esc(t.note || t.cat) + '</div></div>' +
      '<div class="panel" style="padding:4px 18px">' +
      kv('วันที่', fullDay(t.when)) + kv('เวลา', timeOf(t.when)) + kv('ประเภท', isInc ? 'รายรับ' : 'รายจ่าย') +

      var undoNext = function () {
        var x = ulist.pop();
        if (!x) { S.busy = false; S.msg = 'ยกเลิกรายการแล้ว'; render(); return; }
        google.script.run
          .withSuccessHandler(function () { applyDelete(x.row); undoNext(); })
          .withFailureHandler(fail)
          .apiDelete(TOKEN, x.row, x.sig);
      };
      undoNext();
      return;
    }
    else if (act === 'addback') { if (W.step > 1) { W.step--; } else { S.screen = 'home'; } window.scrollTo(0, 0); }
    else if (act === 'wcat') { var ti = typeOfLabel(v); W.label = v; W.type = ti.type; W.cat = ti.cat; W.step = 2; window.scrollTo(0, 0); }
    else if (act === 'wnext') {
      var a = parseFloat(String(W.amount).replace(/,/g, ''));
      if (!(a > 0)) { S.err = 'กรอกจำนวนเงินที่มากกว่า 0'; } else { W.step = 3; window.scrollTo(0, 0); }
    }
    else if (act === 'wdate') { W.dateMode = v; if (v === 'custom' && !W.date) W.date = ymd(new Date()); }
    else if (act === 'wsave') {
      var amt = parseFloat(String(W.amount).replace(/,/g, ''));
      if (!(amt > 0)) { S.err = 'จำนวนเงินไม่ถูกต้อง'; render(); return; }
      var entry = { type: W.type, cat: W.cat, amount: amt, note: W.note.trim(), date: dateOf() };
      S.busy = true; render();
      google.script.run
        .withSuccessHandler(function (item) {
          S.busy = false;
          S.msg = 'บันทึก' + (entry.type === 'income' ? 'รายรับ' : 'รายจ่าย') + ' ' + money(entry.amount) + ' บาท หมวด' + entry.cat + ' แล้ว';
          S.kind = entry.type; S.ym = entry.date.slice(0, 7); S.screen = 'home'; S.cat = null;
          resetW(); window.scrollTo(0, 0);
          if (item && item.row) { applyItems([item]); render(); } else load();
        })
        .withFailureHandler(fail)
        .apiAdd(TOKEN, entry);
      return;
    }
    else if (act === 'editcat') { S.edit = !S.edit; S.confirm = false; }
    else if (act === 'setcat') {
      var t = findRow(S.row); S.busy = true; render();
      google.script.run
        .withSuccessHandler(function (res) { S.busy = false; S.edit = false; applyCat(t.row, v, res && res.sig); render(); })
        .withFailureHandler(fail)
        .apiSetCategory(TOKEN, t.row, t.sig, v);
      return;
    }
    else if (act === 'del') {
      if (!S.confirm) { S.confirm = true; render(); return; }
      var d = findRow(S.row); S.busy = true; render();
      google.script.run
        .withSuccessHandler(function () { S.busy = false; S.confirm = false; S.screen = S.from === 'note' ? 'note' : 'list'; S.row = null; applyDelete(d.row); render(); })
        .withFailureHandler(fail)
        .apiDelete(TOKEN, d.row, d.sig);
      return;
    }
    render();
  });

  app.addEventListener('input', function (ev) {
    var id = ev.target && ev.target.id;
    var pm = /^p-(lbl|amt)-(\d+)$/.exec(id || '');
    if (pm && R.data && R.data.items && R.data.items[+pm[2]]) {
      if (pm[1] === 'lbl') R.data.items[+pm[2]].label = ev.target.value;
      else { R.data.items[+pm[2]].amt = ev.target.value; updatePayTotals(); }
    }
    else if (/^l-[dnac]-\d+$/.test(id || '') && R.data && R.data.rows) {
      var lm = /^l-([dnac])-(\d+)$/.exec(id), lrow = R.data.rows[+lm[2]];
      if (lrow) {
        if (lm[1] === 'd') { lrow.date = ev.target.value; lrow.noDate = false; }
        else if (lm[1] === 'n') lrow.note = ev.target.value;
        else if (lm[1] === 'c') lrow.cat = ev.target.value;
        else { lrow.amt = ev.target.value; updateListTotals(); }
      }
    }
    else if (id === 'f-name' && A.form) A.form.name = ev.target.value;
    else if (id === 'f-auto' && A.form) A.form.auto = ev.target.value;
    else if (id === 'c-amt' && S.close) {
      S.close.amt = ev.target.value;
      var cs = document.getElementById('c-sum'), cg = document.querySelector('[data-act="cgo"]');
      var am = numOrNaN(S.close.amt); if (isNaN(am)) am = 0;
      var lf = leftOf(S.close.ym), ov = am > lf + 0.001 || am < 0, nx2 = shiftMonth(S.close.ym, 1);
      if (cs) cs.innerHTML = ov ? '<span class="exp">ยอดที่เก็บต้องไม่เกิน ' + money(lf) + '</span>'
        : 'เก็บเข้า <b>' + esc((itemOf(S.close.target) || {}).name || '-') + '</b> ' + money(am) + ' · ยกไป ' + MS[+nx2.slice(5, 7) - 1] + ' <b class="inc">' + money(lf - am) + '</b>';
      if (cg) cg.disabled = ov;
    }
    else if (id === 'a-bal' || id === 'a-flow' || id === 'a-date') {
      if (id === 'a-bal') A.bal = ev.target.value;
      if (id === 'a-flow') { A.flow = ev.target.value; A.flowTouched = true; }
      if (id === 'a-date') { A.date = ev.target.value; if (!A.flowTouched) { A.flow = aDefaultFlow(); var fl = document.getElementById('a-flow'); if (fl) fl.value = A.flow; } }
      var acl = document.getElementById('a-calc'); if (acl) acl.innerHTML = aCalc();
    }
    else if (id === 'p-date' && R.data) {
      R.data.date = ev.target.value; R.data.bmPick = '';
      var pm = document.getElementById('p-mon'), nh = payMonthHTML();
      if (pm) pm.outerHTML = nh || '<div id="p-mon"></div>'; else if (nh) { var pdx = document.getElementById('p-date'); if (pdx) pdx.insertAdjacentHTML('afterend', nh); }
      updatePayTotals();
    }
    else if (id === 'p-net' && R.data) { R.data.netIn = ev.target.value; updatePayTotals(); }
    else if (id === 'r-date' && R.data) R.data.date = ev.target.value;
    else if (id === 'r-amt' && R.data) R.data.amt = ev.target.value;
    else if (id === 'r-cat' && R.data) R.data.cat = ev.target.value;
    else if (id === 'r-note' && R.data) R.data.note = ev.target.value;
    else if (id === 'w-link') W.link = ev.target.value;
    else if (id === 'w-say') W.say = ev.target.value;
    else if (id === 'w-amt') W.amount = ev.target.value;
    else if (id === 'w-note') W.note = ev.target.value;
    else if (id === 'w-date') { W.date = ev.target.value; W.dateMode = 'custom'; }
  });

  app.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'w-say') {
      ev.preventDefault();
      var btn = app.querySelector('[data-act="saysave"]'); if (btn) btn.click();
    }
  });

  app.addEventListener('pointerdown', cropDown);
  app.addEventListener('pointermove', cropMove);
  app.addEventListener('pointerup', cropUp);
  app.addEventListener('pointercancel', cropUp);
  document.addEventListener('paste', function (ev) {
    var f = imageFrom(ev.clipboardData && (ev.clipboardData.items || ev.clipboardData.files));
    if (!f) { if (ev.target && ev.target.id === 'pastebox') { ev.preventDefault(); S.pick = false; S.err = 'ที่วางมาไม่ใช่รูป'; render(); } return; }
    if (!canAddImage() && !S.pick) return;
    ev.preventDefault(); openCrop(f);
  });
  var dropOv = document.getElementById('dropov'), dragDepth = 0;
  function hasFiles(ev) { var t = ev.dataTransfer && ev.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0; }
  document.addEventListener('dragenter', function (ev) { if (!hasFiles(ev) || !canAddImage()) return; ev.preventDefault(); dragDepth++; var db = document.getElementById('dropbox'); if (db) db.classList.add('over'); else if (dropOv) dropOv.hidden = false; });
  document.addEventListener('dragover', function (ev) { if (!hasFiles(ev)) return; ev.preventDefault(); if (ev.dataTransfer) ev.dataTransfer.dropEffect = canAddImage() ? 'copy' : 'none'; });
  document.addEventListener('dragleave', function (ev) { if (!hasFiles(ev)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { if (dropOv) dropOv.hidden = true; var db = document.getElementById('dropbox'); if (db) db.classList.remove('over'); } });
  document.addEventListener('drop', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragDepth = 0; if (dropOv) dropOv.hidden = true;
    if (!canAddImage()) return;
    var f = imageFrom(ev.dataTransfer.items) || imageFrom(ev.dataTransfer.files);
    if (f) openCrop(f); else { S.err = 'ที่ลากมาไม่ใช่รูป'; render(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !S.busy && TOKEN) load(); });

  render();
  if (TOKEN) { load(); loadAssets(); }
})();
</script>
</body>
</html>
